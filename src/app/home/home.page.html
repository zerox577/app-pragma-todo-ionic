<app-header title="Tareas"></app-header>

<ion-content [fullscreen]="true" class="home-content">
  <div class="home-shell">
    @if (false) {
      <section class="hero-section">
        <p class="hero-label">{{ currentSection.label }}</p>
        <h1>{{ currentSection.greeting }}</h1>
        <p>{{ currentSection.description }}</p>
      </section>
    }

    @switch (activeTab) {
      @case ('hoy') {
        <app-today></app-today>
      }
      @case ('completadas') {
        <app-completed></app-completed>
      }
      @case ('categorias') {
        <app-categories></app-categories>
      }
    }
  </div>
</ion-content>

<app-footer
  [activeTab]="activeTab"
  (tabChange)="onTabChange($event)"
></app-footer>
