<section class="completed-section">
  <div class="completed-section__header">
    <h1>Completadas</h1>
  </div>

  <div class="completed-section__summary">
    <p>{{ getCompletedTaskLabel(completedTasks().length) }}</p>

    <button
      class="completed-section__clear"
      type="button"
      (click)="clearCompletedTasks()"
    >
      <ion-icon name="trash-outline"></ion-icon>
      <span>Limpiar lista</span>
    </button>
  </div>

  <div class="completed-section__list">
    @if (completedTasks().length > 0) {
      @for (task of completedTasks(); track task.id) {
        <ion-card class="completed-task-card">
          <ion-card-content class="completed-task-card__body">
            <span class="completed-task-card__check" aria-hidden="true">
              <ion-icon name="checkmark-outline"></ion-icon>
            </span>

            <p>{{ task.title }}</p>
          </ion-card-content>
        </ion-card>
      }
    } @else {
      <div class="completed-section__empty">
        <p>No hay tareas completadas.</p>
      </div>
    }
  </div>
</section>
