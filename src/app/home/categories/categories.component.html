<section class="categories-section">
  <div class="categories-section__header">
    <h1>Categorias</h1>
  </div>

  <div class="categories-section__list">
    @for (category of categories(); track category.id) {
      <ion-card class="category-card">
        <ion-card-content class="category-card__body">
          <span
            class="category-card__icon"
            [class]="'category-card__icon category-card__icon--' + category.color"
          >
            <ion-icon [name]="category.icon"></ion-icon>
          </span>

          <div class="category-card__content">
            <h2>{{ category.name }}</h2>
            <p>{{ getCategoryTaskLabel(category.taskCount) }}</p>
          </div>

          <div class="category-card__actions">
            <button
              type="button"
              [attr.aria-label]="'Editar categoria ' + category.name"
              (click)="openEditCategoryModal(category)"
            >
              <ion-icon name="create-outline"></ion-icon>
            </button>
            <button
              type="button"
              [attr.aria-label]="'Eliminar categoria ' + category.name"
              (click)="deleteCategory(category.id)"
            >
              <ion-icon name="trash-outline"></ion-icon>
            </button>
          </div>
        </ion-card-content>
      </ion-card>
    }
  </div>

  <div class="categories-section-btn">
    <button
      class="categories-add-button ion-activatable"
      type="button"
      (click)="openCreateCategoryModal()"
    >
      <span class="categories-add-button__icon">+</span>
      <span>Nueva categoria</span>
      <ion-ripple-effect></ion-ripple-effect>
    </button>
  </div>
</section>

<ion-modal
  cssClass="categories-create-modal"
  [isOpen]="isCreateCategoryModalOpen"
  [canDismiss]="true"
  [backdropDismiss]="true"
  (didDismiss)="closeCreateCategoryModal()"
>
  <ng-template>
    <ion-content [fullscreen]="true" class="categories-modal-content">
      <div class="categories-modal">
        <div class="categories-modal__topbar">
          <button
            class="categories-modal__back"
            type="button"
            aria-label="Cerrar modal"
            (click)="closeCreateCategoryModal()"
          >
            <ion-icon name="arrow-back"></ion-icon>
          </button>
        </div>

        <div class="categories-modal__content">
          <div class="categories-modal__header">
            <h2>Nueva Categoria</h2>
          </div>

          <div class="categories-modal__group">
            <label class="categories-modal__label" for="category-name">
              Nombre de la categoria
            </label>
            <ion-input
              id="category-name"
              class="categories-modal__input"
              fill="outline"
              placeholder="Ej. Trabajo, Personal..."
              [(ngModel)]="categoryName"
            ></ion-input>
          </div>

          <div class="categories-modal__group">
            <span class="categories-modal__label">Color distintivo</span>
            <div class="categories-modal__colors">
              @for (color of colorOptions; track color.id) {
                <button
                  class="categories-color"
                  [class]="'categories-color categories-color--' + color.id"
                  [class.categories-color--selected]="selectedColor === color.id"
                  type="button"
                  [attr.aria-label]="'Seleccionar color ' + color.label.toLowerCase()"
                  (click)="selectColor(color.id)"
                ></button>
              }
            </div>
          </div>

          <div class="categories-modal__group">
            <span class="categories-modal__label">Icono (Opcional)</span>
            <div class="categories-modal__icons">
              @for (icon of iconOptions; track icon.id) {
                <button
                  class="categories-icon"
                  [class.categories-icon--active]="selectedIcon === icon.id"
                  type="button"
                  [attr.aria-label]="'Seleccionar icono ' + icon.label.toLowerCase()"
                  (click)="selectIcon(icon.id)"
                >
                  <ion-icon [name]="icon.id"></ion-icon>
                </button>
              }
            </div>
          </div>

          <button
            class="categories-modal__save ion-activatable"
            type="button"
            (click)="saveCategory()"
          >
            <ion-icon name="checkmark-circle"></ion-icon>
            <span>
              {{ isEditingCategory ? 'Actualizar Categoria' : 'Guardar Categoria' }}
            </span>
            <ion-ripple-effect></ion-ripple-effect>
          </button>
        </div>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
